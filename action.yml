name: 'Honeybadger Deploy Action'
description: 'Send deployment notifications to the Honeybadger API'
branding:
  icon: 'globe'
  color: 'orange'
inputs:
  api_key:
    description: 'The Honeybadger project API key'
    required: true
  environment:
    description: 'The deployment environment. Defaults to production.'
    required: false
    default: 'production'
  endpoint:
    description: 'The deploy submission endpoint. Only used for testing'
    required: false
    default: "https://api.honeybadger.io/v1/deploys"

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
      run: |
        curl -sS \
          "$INPUT_ENDPOINT" \
          -F "api_key=$INPUT_API_KEY" \
          -F "deploy[environment]=$INPUT_ENVIRONMENT" \
          -F "deploy[local_username]=$GITHUB_ACTOR" \
          -F "deploy[revision]=$GITHUB_SHA" \
          -F "deploy[repository]=git@github.com:$GITHUB_REPOSITORY.git"
